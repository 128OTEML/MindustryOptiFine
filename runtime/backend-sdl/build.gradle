apply plugin: "java"

version = "v159.7"

sourceSets.main.java.srcDirs = ["src"]
sourceSets.main.resources.srcDirs = ["libs/linux64", "libs/macosx64", "libs/windows32", "libs/windows64"]

repositories{
    mavenCentral()
    maven{ url = "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven{ url = 'https://www.jitpack.io' }
}

dependencies{
    // arc-core is provided by the game at runtime, but jnigen 3.x resolves the
    // NativeCodeGenerator's classpath from the *main* sourceSet's runtimeClasspath
    // (see JnigenTask), so it must be present there too, not just compileOnly.
    implementation "com.github.Anuken.Arc:arc-core:$version"
    testImplementation "com.github.Anuken.Arc:arc-core:$version"
}

jar{
    //drop-in replacement for the game's bundled arc-sdl.jar
    archiveFileName = "arc-sdl.jar"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/*
The native (JNI) rebuild targets are optional and only wired up when building with -Pjnigen,
e.g. ./gradlew :runtime:backend-sdl:jnigen -Pjnigen

The rest of the build (compiling the patched Java backend + packaging the prebuilt natives
from libs/) does not touch jnigen at all, so the mod CI (`gradlew deploy`) stays fast and clean.

PACKAGES: Linux (Ubuntu)
- libdrm-dev
- libsdl2-dev
- libgbm-dev

PACKAGES: Linux -> Windows Cross-Compilation
- mingw32

PACKAGES: Mac
- sdl2
- glew
 */
if(project.hasProperty("jnigen")){
    apply plugin: "com.badlogicgames.jnigen.jnigen-gradle"

    task preJni{
        def root = "build/jnigen/sources"
        def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

        doFirst{
            file(root).mkdirs()

            // cross-platform download: PowerShell on Windows, curl everywhere else
            def download = { url, out ->
                if(isWindows){
                    "powershell -Command \"Invoke-WebRequest -Uri '$url' -OutFile '$out'\"".execute().waitFor()
                }else{
                    "curl -L -o $out $url".execute().waitFor()
                }
            }

            if(!file("$root/glew.zip").exists()){
                println "Fetching GLEW source..."
                def glewUrl = "https://github.com/nigels-com/glew/releases/download/glew-2.2.0/glew-2.2.0.zip"
                def glewZip = file("$root/glew.zip")

                download(glewUrl, glewZip.absolutePath)

                if(isWindows){
                    "powershell -Command \"Expand-Archive -Path '${glewZip.absolutePath}' -DestinationPath '${file(root).absolutePath}' -Force\"".execute().waitFor()
                }else{
                    "unzip -qq -d ${file(root).absolutePath} ${glewZip.absolutePath}".execute().waitFor()
                }
            }

            if(!file("$root/sdlmingw.tar.gz").exists()){
                println "Fetching SDL-mingw builds..."
                def sdlUrl = "https://www.libsdl.org/release/SDL2-devel-2.32.8-mingw.tar.gz"
                def sdlTar = file("$root/sdlmingw.tar.gz")

                download(sdlUrl, sdlTar.absolutePath)
                "tar -xvzf ${sdlTar.absolutePath} -C ${file(root).absolutePath}".execute().waitFor()
            }
        }
    }

    jnigen{
        sharedLibName = "sdl-arc"
        libsDir = "libs"

        def sdlVersion = "2.32.8"
        def mainRoot = "build/jnigen/sources"

        all{
            cIncludes = ["$mainRoot/glew-2.2.0/src/glew.c"]
            headerDirs = ["$mainRoot/glew-2.2.0/include"]
        }

        def execCmd = { cmd ->
            try{
                def process = cmd instanceof List ? new ProcessBuilder(cmd).redirectErrorStream(true).start() : Runtime.getRuntime().exec(cmd)
                process.waitFor()
                Scanner s = new Scanner(process.getInputStream()).useDelimiter("\\A")
                return s.hasNext() ? s.next().trim() : ""
            }catch(Exception ignored){
                return ""
                //fail silently, because this is run during standard builds and it shouldn't fail
            }
        }

        def splitArgs = { value ->
            return value == null || value.isBlank() ? [] : value.trim().split(/\s+/).findAll{ !it.isBlank() }
        }

        def normalizeWindowsArg = { value ->
            if(value == null) return value
            if(value ==~ /^\/[A-Za-z]\/.*/){
                return value.substring(1, 2).toUpperCase() + ":/" + value.substring(3)
            }
            if(value ==~ /^-[IL]\/[A-Za-z]\/.*/){
                return value.substring(0, 2) + value.substring(3, 4).toUpperCase() + ":/" + value.substring(5)
            }
            return value
        }

        addLinux(x64, x86){
            cppFlags += execCmd("sdl2-config --cflags").split(" ")
            cFlags = cppFlags
            libraries = (execCmd("sdl2-config --libs") + " -Wl,-Bdynamic -lGL").split(" ")
            linkerFlags = "-shared -m64".split(" ")
        }

        // Compute Windows link flags directly from the extracted SDL2 mingw layout instead of
        // executing the fragile sdl2-config script (which fails on Linux CI runners).
        addWindows(x64, x86){ bt ->
            def triplet = (bt.bitness == x64) ? "x86_64-w64-mingw32" : "i686-w64-mingw32"
            def path = "SDL2-$sdlVersion/$triplet"
            def root = "$projectDir/build/jnigen/sources"
            def sdlRoot = "$root/$path"
            def sdlLib = "${sdlRoot.replace('\\', '/')}/lib"
            headerDirs += (String[])["$mainRoot/$path/include/SDL2"]
            libraries = "-L${sdlLib} -Wl,-Bstatic -lSDL2 -Wl,-Bdynamic -lSDL2main -lm -ldinput -ldxguid -ldxerr8 -luser32 -lgdi32 -lwinmm -limm32 -lole32 -loleaut32 -lshell32 -lversion -luuid -ladvapi32 -lsetupapi -lopengl32".split(" ")
            linkerFlags += (String[])["-L${sdlLib}"]
        }

        // macOS: derive arch from the build target and resolve libs via sdl2-config + brew (no
        // hardcoded /usr/local/lib paths, which don't exist on Apple-Silicon runners).
        def addMacTargets = { bt ->
            def arch = (bt.architecture == ARM) ? "arm64" : "x86_64"
            def cflags = execCmd("sdl2-config --cflags")
            def libs = execCmd("sdl2-config --libs")
            def glewPrefix = execCmd("brew --prefix glew").trim()
            cppFlags = cFlags = (cflags + " -c -Wall -O2 -arch " + arch + " -DFIXED_POINT -fmessage-length=0 -fPIC -mmacosx-version-min=10.9 -stdlib=libc++").split(" ")
            linkerFlags = ("-shared -arch " + arch + " -mmacosx-version-min=10.9 -stdlib=libc++").split(" ")
            libraries = (libs + (glewPrefix ? " -L${glewPrefix}/lib" : "") + " -lGLEW -Wl,-framework,OpenGL").split(" ")
        }

        addMac(x64, ARM, addMacTargets)
        addMac(x64, x86, addMacTargets)
    }

    getTasksByName("jnigen", true).each{
        it.dependsOn preJni
        it.dependsOn classes
    }
}