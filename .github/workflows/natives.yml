name: Build SDL Natives

# Auto-generates the SDL JNI natives (sdl-arc*.dll/.so/.dylib) from the Java
# sources via gdx-jnigen. No C is hand-written: `jnigen` generates the JNI
# wrappers, `jnigenBuildAll*` compiles them, and the result lands in
# runtime/backend-sdl/libs/<platform>/.

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime/backend-sdl/**'
      - '.github/workflows/natives.yml'

jobs:
  natives-windows-linux:
    # Windows natives are cross-compiled with MinGW on Linux (matches upstream Arc CI).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64 gcc-mingw-w64 \
            libsdl2-dev libglew-dev libgl1-mesa-dev libdrm-dev libgbm-dev unzip

      - name: Build Windows + Linux natives
        run: |
          chmod +x ./gradlew
          ./gradlew :runtime:backend-sdl:jnigenBuildAllWindows :runtime:backend-sdl:jnigenBuildAllLinux -Pjnigen

      - name: Upload natives
        uses: actions/upload-artifact@v4
        with:
          name: SDL natives (Windows + Linux)
          path: |
            runtime/backend-sdl/libs/windows64
            runtime/backend-sdl/libs/windows32
            runtime/backend-sdl/libs/linux64

  natives-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install build dependencies
        run: |
          brew install sdl2 glew

      - name: Build Mac natives
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.9'
        run: |
          chmod +x ./gradlew
          ./gradlew :runtime:backend-sdl:jnigenBuildAllMacOsX -Pjnigen

      - name: Upload natives
        uses: actions/upload-artifact@v4
        with:
          name: SDL natives (Mac)
          path: |
            runtime/backend-sdl/libs/macosx64
